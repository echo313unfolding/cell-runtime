[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cell-runtime"
version = "0.1.0"
description = "Multi-lane local AI orchestrator with intelligent routing, model swapping, and rolling memory"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Echo Labs"}
]
keywords = ["llm", "inference", "edge-ai", "orchestration", "llama-cpp", "on-device"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "huggingface_hub>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "requests",
]

[project.scripts]
cell = "cell.orchestrator:main"
cell-gateway = "cell.gateway:main"

[project.urls]
Homepage = "https://github.com/echo313unfolding/cell-runtime"
Repository = "https://github.com/echo313unfolding/cell-runtime"
Issues = "https://github.com/echo313unfolding/cell-runtime/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cell = ["data/*.json"]

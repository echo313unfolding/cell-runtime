version: "3.8"

services:
  cell-gateway:
    image: echo-cell
    build:
      context: ..
      dockerfile: cell-runtime/Dockerfile
    ports:
      - "8800:8800"
    volumes:
      - cell-models:/models
      - cell-receipts:/receipts
    environment:
      - CELL_MODELS_DIR=/models
      - CELL_RECEIPTS_DIR=/receipts
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    entrypoint: ["python3", "-m", "cell.gateway"]
    command: ["--port", "8800"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8800/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  cell-models:
  cell-receipts:
